<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bus Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100 font-sans">
    <!-- Top Bar -->
    <header class="bg-white shadow-sm p-4 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <img src="https://i.ibb.co/x6CJ90C/logo.png" alt="Logo" class="h-12" />
        <h1 class="text-2xl font-bold text-gray-800">
          Bus Management System
        </h1>
      </div>
      <div class="flex gap-3">
        <button class="bg-purple-600 text-white px-4 py-2 rounded-md hover:bg-purple-700">
          Manual
        </button>
        <button class="bg-purple-500 text-white px-4 py-2 rounded-md hover:bg-purple-600">
          Automatic
        </button>
        <button class="bg-purple-400 text-white px-4 py-2 rounded-md hover:bg-purple-500">
          Print
        </button>
        <button class="bg-gray-100 p-2 rounded-full hover:bg-gray-200">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto py-10 px-4">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-semibold text-gray-800">Last Assignments</h2>
        <button class="bg-purple-600 text-white px-4 py-2 rounded-md hover:bg-purple-700">
          Day Shift
        </button>
      </div>

      <!-- Modern Table Card -->
      <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <table class="min-w-full text-sm text-gray-700">
          <thead class="bg-purple-50 text-gray-700 text-md">
            <tr>
              <th class="px-6 py-4 text-left">Bus ID</th>
              <th class="px-6 py-4 text-left">Capacity</th>
              <th class="px-6 py-4 text-left">Assigned</th>
              <th class="px-6 py-4 text-left">Utilization</th>
              <th class="px-6 py-4 text-left">Stands</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <tr class="hover:bg-gray-50 transition">
              <td colspan="5" class="px-6 py-8 text-center text-gray-400">
                No buses assigned yet
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
