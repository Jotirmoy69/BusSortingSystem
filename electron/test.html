<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাস ডিসপ্লে</title>
    <style>
        @font-face {
            font-family: 'Noto Serif Bengali';
            src: local('Noto Serif Bengali'), 
                 local('NotoSerifBengali'),
                 url('src/renderer/assets/fonts/NotoSerifBengali-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Noto Serif Bengali';
            src: local('Noto Serif Bengali Bold'), 
                 local('NotoSerifBengali-Bold'),
                 url('fonts/NotoSerifBengali-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        :root {
            --day-bg: #ffffff;
            --day-card-bg: #d0e8ff;
            --day-text: #000000;
            --day-header: #1a73e8;
            
            --night-bg: #101820;
            --night-card-bg: #1e2a3a;
            --night-text: #00FFDD;
            --night-header: #00BFFF;
            --night-border: #1a4b8c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Serif Bengali', serif;
        }

        body {
            background-color: var(--day-bg);
            color: var(--day-text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            transition: all 0.3s ease;
        }

        body.night-mode {
            background-color: var(--night-bg);
            color: var(--night-text);
        }

        .container {
            padding: 1vh;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1vh 2vw;
            margin-bottom: 1vh;
            height: 8vh;
        }

        .app-title {
            font-size: 4vmin;
            font-weight: bold;
            white-space: nowrap;
        }

        .day-mode .app-title {
            color: var(--day-header);
        }

        .night-mode .app-title {
            color: var(--night-header);
        }

        .controls {
            display: flex;
            gap: 2vmin;
            align-items: center;
        }

        .mode-toggle {
            position: relative;
            width: 8vmin;
            height: 4vmin;
            border-radius: 2vmin;
            background: #ccc;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-toggle.night {
            background: #555;
        }

        .toggle-slider {
            position: absolute;
            width: 3.5vmin;
            height: 3.5vmin;
            border-radius: 50%;
            background: white;
            top: 0.25vmin;
            left: 0.25vmin;
            transition: all 0.3s;
        }

        .night .toggle-slider {
            left: 4.25vmin;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 1vmin;
            font-weight: bold;
            font-size: 2.5vmin;
            white-space: nowrap;
        }

        .live-indicator .pulse {
            width: 2vmin;
            height: 2vmin;
            border-radius: 50%;
            background: red;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(18vw, 1fr));
            grid-auto-rows: minmax(40vh, 1fr);
            gap: 1.5vmin;
            height: 88vh;
            width: 98vw;
            padding: 0 1vw;
            overflow: hidden;
        }

        .bus-card {
            border-radius: 1.5vmin;
            padding: 1.5vmin;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
            overflow: hidden;
        }

        .day-mode .bus-card {
            background-color: var(--day-card-bg);
            box-shadow: 0 0.5vmin 1vmin rgba(0,0,0,0.1);
        }

        .night-mode .bus-card {
            background-color: var(--night-card-bg);
            border: 0.3vmin solid var(--night-border);
            box-shadow: 0 0 2vmin rgba(0, 191, 255, 0.2);
        }

        .card-header {
            font-size: 3vmin;
            font-weight: bold;
            margin-bottom: 1.5vmin;
            text-align: center;
            padding-bottom: 0.5vmin;
            border-bottom: 0.3vmin solid;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .day-mode .card-header {
            color: var(--day-header);
            border-color: rgba(0,0,0,0.2);
        }

        .night-mode .card-header {
            color: var(--night-header);
            border-color: var(--night-border);
        }

        .stands-list {
            display: flex;
            flex-direction: column;
            gap: 1vmin;
            flex-grow: 1;
            justify-content: space-around;
            overflow: hidden;
        }

        .stand-item {
            font-size: 2.5vmin;
            font-weight: bold;
            text-align: center;
            padding: 0.5vmin;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .day-mode .stand-item {
            color: var(--day-text);
        }

        .night-mode .stand-item {
            color: var(--night-text);
        }

        .audio-indicator {
            position: absolute;
            bottom: 1vmin;
            right: 1vmin;
            font-size: 2.5vmin;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0% { opacity: 0.7; }
            50% { opacity: 1; text-shadow: 0 0 1vmin currentColor; }
            100% { opacity: 0.7; }
        }

        @media (orientation: portrait) {
            .cards-container {
                grid-template-columns: repeat(auto-fit, minmax(40vw, 1fr));
                grid-auto-rows: minmax(25vh, 1fr);
            }
            
            .stand-item {
                font-size: 2vmin;
            }
        }
    </style>
</head>
<body class="day-mode">
    <div class="container">
        <header class="header">
            <h1 class="app-title">স্কুল বাস রুট ডিসপ্লে</h1>
            <div class="controls">
                <div class="live-indicator">
                    <div class="pulse"></div>
                    <span>লাইভ</span>
                </div>
                <div class="mode-toggle" id="modeToggle">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </header>

        <div class="cards-container" id="cardsContainer">
            <!-- Cards will be generated by JavaScript -->
        </div>
    </div>

    <script>
        // Sample data for buses
        const busData = [
            {
                number: "০১",
                type: "ছাত্র",
                stands: ["মাটিডালি মোড়", "বড়গোলা", "পৌরসভা", "পৌর পার্ক", "টাউন হল", "স্কুল গেট"]
            },
            {
                number: "০২",
                type: "ছাত্র",
                stands: ["উপশহর", "চারমাথা", "বাস স্ট্যান্ড", "শাহী মসজিদ", "স্কুল গেট"]
            },
            {
                number: "০৩",
                type: "ছাত্রী",
                stands: ["নুরানীর মোড়", "টেকনিক্যাল", "টি-এন্ড-টি", "স্কুল গেট"]
            },
            {
                number: "০৪",
                type: "ছাত্রী",
                stands: ["মধুবন", "কাস্টম অফিস", "জেলা পরিষদ", "স্কুল গেট"]
            },
            {
                number: "০৫",
                type: "ছাত্র",
                stands: ["বকশি বাজার", "ডিসির বাংলো", "জজ কোর্ট", "স্কুল গেট"]
            },
            {
                number: "০৬",
                type: "ছাত্রী",
                stands: ["ফুলতলা", "খেজুরতলা", "স্কুল গেট"]
            },
            {
                number: "০৭",
                type: "ছাত্র",
                stands: ["বাজার", "মসজিদ", "স্কুল গেট"]
            },
            {
                number: "০৮",
                type: "ছাত্রী",
                stands: ["রেলওয়ে স্টেশন", "বাস টার্মিনাল", "স্কুল গেট"]
            },
            {
                number: "০৯",
                type: "ছাত্র",
                stands: ["নতুন বাজার", "পুরাতন বাজার", "স্কুল গেট"]
            },
            {
                number: "১০",
                type: "ছাত্রী",
                stands: ["শাপলা চত্বর", "পদ্মা চত্বর", "স্কুল গেট"]
            }
        ];

        // Generate cards dynamically
        const cardsContainer = document.getElementById('cardsContainer');
        
        function generateCards() {
            cardsContainer.innerHTML = '';
            busData.forEach(bus => {
                const card = document.createElement('div');
                card.className = 'bus-card';
                
                card.innerHTML = `
                    <div class="card-header">বাস নং ${bus.number} (${bus.type})</div>
                    <div class="stands-list">
                        ${bus.stands.map((stand, index) => 
                            `<div class="stand-item">${index + 1}. ${stand}</div>`
                        ).join('')}
                    </div>
                    <div class="audio-indicator">🔊</div>
                `;
                
                cardsContainer.appendChild(card);
            });
            
            adjustTextSizes();
        }

        // Adjust text sizes based on available space
        function adjustTextSizes() {
            const cards = document.querySelectorAll('.bus-card');
            if (cards.length === 0) return;
            
            // Get the first card as reference
            const card = cards[0];
            const header = card.querySelector('.card-header');
            const standItem = card.querySelector('.stand-item');
            
            // Measure available space
            const cardHeight = card.clientHeight;
            const headerHeight = header.clientHeight;
            const standsContainerHeight = cardHeight - headerHeight - 30; // 30px for padding/margins
            
            // Calculate optimal font size
            const standsCount = busData[0].stands.length;
            const optimalStandItemHeight = standsContainerHeight / standsCount;
            const standFontSize = Math.min(optimalStandItemHeight * 0.5, 30); // Cap at 30px
            
            // Apply to all cards
            document.querySelectorAll('.stand-item').forEach(item => {
                item.style.fontSize = `${standFontSize}px`;
            });
        }

        // Toggle between day and night mode
        const modeToggle = document.getElementById('modeToggle');
        const body = document.body;

        modeToggle.addEventListener('click', function() {
            this.classList.toggle('night');
            body.classList.toggle('night-mode');
            body.classList.toggle('day-mode');
            
            // Save preference to localStorage
            const isNightMode = body.classList.contains('night-mode');
            localStorage.setItem('nightMode', isNightMode);
        });

        // Check for saved preference
        if (localStorage.getItem('nightMode') === 'true') {
            modeToggle.classList.add('night');
            body.classList.add('night-mode');
            body.classList.remove('day-mode');
        }

        // Initialize
        generateCards();
        
        // Adjust on resize
        window.addEventListener('resize', () => {
            adjustTextSizes();
        });

        // Auto-refresh every 30 seconds
        setInterval(() => {
            // In a real app, you would fetch new data here
            console.log('Refreshing data...');
            generateCards();
        }, 30000);
    </script>
</body>
</html>
