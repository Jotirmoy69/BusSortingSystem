<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>স্কুল বাস ম্যানেজমেন্ট</title>
    <style>
      .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeOut 1.5s forwards 2s;
        }

        .splash-logo {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite, bounce 2s infinite;
        }

        .splash-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 20px;
            animation: fadeIn 1s ease-in;
        }

        .splash-loader {
            width: 80%;
            max-width: 300px;
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            overflow: hidden;
        }

        .splash-loader-bar {
            height: 100%;
            width: 0;
            background: var(--primary);
            animation: load 2s forwards;
        }
    </style>
  </head>
  <body>
    <div class="splash-screen">
        <div class="splash-logo">
            <img src="./bcpsc.png" alt="Logo" style="width: 100%; height: auto;">
        </div>
        <h1 class="splash-title">স্কুল বাস ম্যানেজমেন্ট</h1>
        <div class="splash-loader">
            <div class="splash-loader-bar"></div>
        </div>
    </div>
  </body>
</html>
